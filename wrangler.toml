# Sonela hub site: static pages (public/) + a small script (src/worker.js) for the apps' downloads, update checks,
# download buttons, the "What's new" lists on /aimdot and /lasso (read from GitHub, kept in Cloudflare's cache) and the
# daily counts (optional D1 database below; without it nothing is counted). Free plan. Optional secret GITHUB_TOKEN (read-only, public repos)
# only raises GitHub's rate limit; without it the script falls back to reading github.com.
# Deploy (from this folder): npx wrangler deploy
name = "sonela-hub"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# sonela.app is on Cloudflare (bought 10 Nov 2026): on deploy, wrangler adds the DNS records + certificates for both by itself.
# www.sonela.app shows the same pages; every page's canonical tag points to https://sonela.app, so search engines see one site.
routes = [
  { pattern = "sonela.app", custom_domain = true },
  { pattern = "www.sonela.app", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# only these paths run the script first; every other page is served straight from public/
run_worker_first = ["/aimdot", "/aimdot/download/*", "/aimdot/update/*", "/aimdot/changes", "/aimdot/ping", "/lasso", "/lasso/download/*", "/lasso/update/*", "/lasso/changes", "/lasso/ping", "/stats", "/admin", "/admin/*"]
html_handling = "auto-trailing-slash"   # about.html is served at /about
not_found_handling = "404-page"         # unknown paths get public/404.html with status 404

# Daily counts (downloads / installs / users per app per day, numbers only) - shown at sonela.app/admin (src/admin.js).
# Set up once: npx wrangler d1 create sonela-stats   -> paste its database_id below and remove the #s,
# then: npx wrangler d1 execute sonela-stats --remote --file=schema.sql   (until then the script counts nothing).
# /admin signs in with Echo's admin email code through the ECHO binding below - no password of its own.
[[d1_databases]]
binding = "STATS"
database_name = "sonela-stats"
database_id = "1fdcfaba-5f4c-415b-b254-93cadef3115e"

# sonela.app/admin's sign-in (echoclip.link/admin's email code) and Echo's numbers: a service binding to the echo-cloud
# Worker's "HubStats" entrypoint (Echo's cloud/src/index.js + hub_stats.js). It has no web address - only Workers in the
# same Cloudflare account can call it - so no secret is needed. Deploy echo-cloud (with HubStats) BEFORE this site.
[[services]]
binding = "ECHO"
service = "echo-cloud"
entrypoint = "HubStats"
